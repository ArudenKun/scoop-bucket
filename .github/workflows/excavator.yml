on:
  workflow_dispatch:
  schedule:
    # Run every day at 5 AM Philippine Time (UTC+8) which is 21:00 UTC (previous day)
    - cron: '0 21 * * *'
    # run every 12 hours (optional - keep if you still want this)
    # - cron: '0 */12 * * *'
name: Excavator
jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
